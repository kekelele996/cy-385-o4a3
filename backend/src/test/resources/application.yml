server:
  port: 8080
spring:
  datasource:
    url: jdbc:h2:mem:babytracker;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
jwt:
  secret: test_secret
